<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="hg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFCC02"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <linearGradient id="sand" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFCC80"/>
      <stop offset="100%" stop-color="#FF8F00"/>
    </linearGradient>
    <clipPath id="c"><rect width="120" height="120"/></clipPath>
  </defs>
  <g clip-path="url(#c)">

    <!-- ── Top cap shadow ── -->
    <rect x="30" y="15" width="62" height="8" rx="4" fill="#8D2000" opacity="0.3"/>
    <!-- ── Top cap main ── -->
    <rect x="28" y="13" width="62" height="8" rx="4" fill="url(#hg)"/>
    <rect x="30" y="13" width="30" height="4" rx="2" fill="#FFCC80" opacity="0.4"/>

    <!-- ── Bottom cap shadow ── -->
    <rect x="30" y="97" width="62" height="8" rx="4" fill="#8D2000" opacity="0.3"/>
    <!-- ── Bottom cap main ── -->
    <rect x="28" y="96" width="62" height="8" rx="4" fill="url(#hg)"/>

    <!-- ── Top bulb shadow ── -->
    <path d="M 32,21 Q 32,15 38,15 L 84,15 Q 90,15 90,21 L 82,56 Q 78,62 60,62 Q 42,62 38,56 Z"
          fill="#8D2000" opacity="0.25" transform="translate(2,3)"/>

    <!-- ── Top bulb main outline ── -->
    <path d="M 32,21 Q 32,15 38,15 L 84,15 Q 90,15 90,21 L 82,56 Q 78,62 60,62 Q 42,62 38,56 Z"
          fill="none" stroke="url(#hg)" stroke-width="4" stroke-linejoin="round"/>

    <!-- ── Top bulb inner glass ── -->
    <path d="M 36,23 L 76,23 L 71,48 Q 67,56 60,56 Q 53,56 49,48 Z"
          fill="url(#sand)" opacity="0.55"/>

    <!-- ── Top bulb glass sheen ── -->
    <path d="M 38,20 Q 44,16 54,16" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.45"/>

    <!-- ── Neck shadow ── -->
    <rect x="34" y="57" width="54" height="9" rx="3" fill="#8D2000" opacity="0.3" transform="translate(2,2)"/>
    <!-- ── Neck main ── -->
    <rect x="32" y="56" width="54" height="9" rx="3" fill="#F57C00"/>
    <rect x="34" y="57" width="28" height="4" rx="2" fill="#FFCC80" opacity="0.4"/>

    <!-- ── Bottom bulb main outline ── -->
    <path d="M 38,65 Q 42,61 60,61 Q 78,61 82,65 L 90,100 Q 90,106 84,106 L 36,106 Q 30,106 30,100 Z"
          fill="none" stroke="url(#hg)" stroke-width="4" stroke-linejoin="round"/>

    <!-- ── Bottom sand pile ── -->
    <ellipse cx="60" cy="100" rx="20" ry="7" fill="#FF8F00" opacity="0.7"/>
    <ellipse cx="60" cy="98" rx="14" ry="4" fill="#FFCC80" opacity="0.5"/>

    <!-- ── Falling sand particles ── -->
    <circle cx="60" cy="72" r="2.5" fill="#FFCC80" opacity="0.9"/>
    <circle cx="56" cy="78" r="2"   fill="#FFB300" opacity="0.75"/>
    <circle cx="64" cy="82" r="2"   fill="#FFB300" opacity="0.75"/>
    <circle cx="59" cy="88" r="1.8" fill="#FFCC80" opacity="0.55"/>
    <circle cx="63" cy="93" r="1.5" fill="#FFCC80" opacity="0.4"/>

    <!-- ── Sparkle accent ── -->
    <rect x="95" y="10" width="9.6" height="9.6" rx="2" fill="#FFA726" opacity="0.95"/>
    <circle cx="110" cy="24" r="3.6" fill="#FFA726" opacity="0.95"/>
  </g>
</svg>
