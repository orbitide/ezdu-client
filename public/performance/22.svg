<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="pg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BBDEFB"/>
      <stop offset="100%" stop-color="#1565C0"/>
    </linearGradient>
    <linearGradient id="pg2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E3F2FD"/>
      <stop offset="100%" stop-color="#1976D2"/>
    </linearGradient>
    <radialGradient id="bulbg" cx="40%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FFF9C4"/>
      <stop offset="60%" stop-color="#FDD835"/>
      <stop offset="100%" stop-color="#F9A825"/>
    </radialGradient>
    <clipPath id="c"><rect width="120" height="120"/></clipPath>
  </defs>
  <g clip-path="url(#c)">

    <!-- ── Bulb glow halo ── -->
    <circle cx="60" cy="30" r="22" fill="#FFF9C4" opacity="0.2"/>

    <!-- ── Bulb shadow ── -->
    <circle cx="62" cy="32" r="16" fill="#8D6E00" opacity="0.25"/>

    <!-- ── Bulb main ── -->
    <circle cx="60" cy="30" r="16" fill="url(#bulbg)"/>

    <!-- ── Bulb highlight ── -->
    <ellipse cx="54" cy="24" rx="6" ry="4" fill="white" opacity="0.45" transform="rotate(-20 54 24)"/>

    <!-- ── Bulb base / socket ── -->
    <rect x="53" y="44" width="14" height="7" rx="3" fill="#FDD835" stroke="#F9A825" stroke-width="1.5"/>
    <rect x="54" y="49" width="12" height="5" rx="2" fill="#F57F17" stroke="#E65100" stroke-width="1"/>
    <rect x="55" y="52" width="10" height="4" rx="2" fill="#6D4C41" stroke="#4E342E" stroke-width="1"/>

    <!-- ── Bulb rays ── -->
    <line x1="60" y1="10" x2="60" y2="4"  stroke="#FDD835" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    <line x1="78" y1="16" x2="82" y2="11" stroke="#FDD835" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    <line x1="42" y1="16" x2="38" y2="11" stroke="#FDD835" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    <line x1="84" y1="30" x2="90" y2="30" stroke="#FDD835" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    <line x1="36" y1="30" x2="30" y2="30" stroke="#FDD835" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    <line x1="76" y1="44" x2="80" y2="49" stroke="#FDD835" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <line x1="44" y1="44" x2="40" y2="49" stroke="#FDD835" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

    <!-- ── Book left page shadow ── -->
    <path d="M 16,64 Q 16,57 24,57 L 58,57 L 58,101 Q 46,97 24,99 Q 16,99 16,92 Z"
          fill="#0D3780" opacity="0.3" transform="translate(2,3)"/>

    <!-- ── Book left page main ── -->
    <path d="M 14,62 Q 14,55 22,55 L 58,55 L 58,99 Q 46,95 22,97 Q 14,97 14,90 Z"
          fill="url(#pg)"/>

    <!-- ── Left page highlight ── -->
    <path d="M 16,58 Q 22,56 36,56 L 36,70 Q 22,68 16,66 Z" fill="white" opacity="0.2"/>

    <!-- ── Left page lines ── -->
    <line x1="22" y1="68" x2="52" y2="68" stroke="#5C9BD6" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <line x1="22" y1="75" x2="52" y2="75" stroke="#5C9BD6" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <line x1="22" y1="82" x2="52" y2="82" stroke="#5C9BD6" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <line x1="22" y1="89" x2="42" y2="89" stroke="#5C9BD6" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

    <!-- ── Book right page shadow ── -->
    <path d="M 104,64 Q 104,57 96,57 L 62,57 L 62,101 Q 74,97 96,99 Q 104,99 104,92 Z"
          fill="#0D3780" opacity="0.3" transform="translate(2,3)"/>

    <!-- ── Book right page main ── -->
    <path d="M 106,62 Q 106,55 98,55 L 62,55 L 62,99 Q 74,95 98,97 Q 106,97 106,90 Z"
          fill="url(#pg2)"/>

    <!-- ── Right page highlight ── -->
    <path d="M 104,58 Q 98,56 84,56 L 84,70 Q 98,68 104,66 Z" fill="white" opacity="0.2"/>

    <!-- ── Right page lines ── -->
    <line x1="68" y1="68" x2="98" y2="68" stroke="#90CAF9" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <line x1="68" y1="75" x2="98" y2="75" stroke="#90CAF9" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <line x1="68" y1="82" x2="98" y2="82" stroke="#90CAF9" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <line x1="68" y1="89" x2="86" y2="89" stroke="#90CAF9" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

    <!-- ── Spine ── -->
    <rect x="57" y="55" width="6" height="44" fill="#1565C0"/>
    <line x1="60" y1="55" x2="60" y2="99" stroke="#90CAF9" stroke-width="1" opacity="0.4"/>

    <!-- ── Sparkle accent ── -->
    <rect x="95" y="10" width="9.6" height="9.6" rx="2" fill="#FDD835" opacity="0.95"/>
    <circle cx="110" cy="24" r="3.6" fill="#FDD835" opacity="0.95"/>
  </g>
</svg>
