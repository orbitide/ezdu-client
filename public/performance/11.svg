<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="cg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <linearGradient id="cg2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF9C4"/>
      <stop offset="100%" stop-color="#FFC107"/>
    </linearGradient>
    <clipPath id="c"><rect width="120" height="120"/></clipPath>
  </defs>
  <g clip-path="url(#c)">

    <!-- ── Board shadow ── -->
    <polygon points="63,33 25,53 97,53" fill="#8D4E00" opacity="0.3"/>
    <rect x="25" y="48" width="72" height="13" rx="3" fill="#8D4E00" opacity="0.3"/>

    <!-- ── Board top (flat) ── -->
    <polygon points="60,28 22,50 98,50" fill="url(#cg)"/>
    <polygon points="60,28 22,50 98,50" fill="none" stroke="#B8860B" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- ── Board brim ── -->
    <rect x="22" y="46" width="74" height="13" rx="3" fill="#FFA000"/>
    <rect x="24" y="47" width="42" height="6" rx="2" fill="#FFE082" opacity="0.45"/>

    <!-- ── Board top highlight ── -->
    <polygon points="60,28 40,40 80,40" fill="#FFF9C4" opacity="0.3"/>

    <!-- ── Cap button ── -->
    <circle cx="62" cy="31" r="5" fill="#8D4E00" opacity="0.3"/>
    <circle cx="60" cy="29" r="5" fill="#795548"/>
    <circle cx="58" cy="27" r="2" fill="#A1887F" opacity="0.5"/>

    <!-- ── Dome shadow ── -->
    <ellipse cx="62" cy="62" rx="30" ry="12" fill="#8D4E00" opacity="0.25"/>

    <!-- ── Dome main ── -->
    <ellipse cx="60" cy="60" rx="30" ry="12" fill="url(#cg2)"/>

    <!-- ── Dome highlight ── -->
    <ellipse cx="50" cy="57" rx="14" ry="5" fill="white" opacity="0.3"/>

    <!-- ── Dome stroke ── -->
    <ellipse cx="60" cy="60" rx="30" ry="12" fill="none" stroke="#B8860B" stroke-width="1.5"/>

    <!-- ── Tassel string shadow ── -->
    <path d="M 92,48 Q 100,55 98,75" fill="none" stroke="#8D4E00" stroke-width="3" stroke-linecap="round" opacity="0.3"/>
    <!-- ── Tassel string main ── -->
    <path d="M 90,47 Q 98,54 96,74" fill="none" stroke="#795548" stroke-width="3" stroke-linecap="round"/>

    <!-- ── Tassel knob shadow ── -->
    <circle cx="97" cy="77" r="7" fill="#8D4E00" opacity="0.3"/>
    <!-- ── Tassel knob main ── -->
    <circle cx="95" cy="76" r="7" fill="#FFA000"/>
    <circle cx="95" cy="76" r="5" fill="#FFC107"/>
    <circle cx="93" cy="74" r="2.5" fill="#FFE082" opacity="0.55"/>

    <!-- ── Tassel fringe ── -->
    <line x1="91" y1="82" x2="88" y2="93" stroke="#795548" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="95" y1="83" x2="95" y2="95" stroke="#795548" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="99" y1="82" x2="102" y2="93" stroke="#795548" stroke-width="2.5" stroke-linecap="round"/>

    <!-- ── Small star top-right ── -->
    <polygon points="26,14 28,20 34,20 29.5,24 31,30 26,27 21,30 22.5,24 18,20 24,20"
             fill="#FFC107" stroke="#E65100" stroke-width="1" opacity="0.9"/>

    <!-- ── Sparkle accent ── -->
    <rect x="95" y="10" width="9.6" height="9.6" rx="2" fill="#FFC107" opacity="0.95"/>
    <circle cx="110" cy="24" r="3.6" fill="#FFC107" opacity="0.95"/>
  </g>
</svg>
