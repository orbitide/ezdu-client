<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="sg" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFEB3B"/>
      <stop offset="50%" stop-color="#FFC107"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <radialGradient id="shine" cx="30%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#FFF9C4" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFF9C4" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="c"><rect width="120" height="120"/></clipPath>
  </defs>
  <g clip-path="url(#c)">

    <!-- ── Left laurel shadow ── -->
    <ellipse cx="31" cy="76" rx="11" ry="5" fill="#1B5E20" opacity="0.3" transform="rotate(-20 31 76)"/>
    <ellipse cx="24" cy="62" rx="11" ry="5" fill="#1B5E20" opacity="0.3" transform="rotate(-48 24 62)"/>
    <ellipse cx="27" cy="47" rx="11" ry="5" fill="#1B5E20" opacity="0.3" transform="rotate(-75 27 47)"/>

    <!-- ── Left laurel main ── -->
    <ellipse cx="29" cy="74" rx="11" ry="5" fill="#43A047" transform="rotate(-20 29 74)"/>
    <ellipse cx="22" cy="60" rx="11" ry="5" fill="#388E3C" transform="rotate(-48 22 60)"/>
    <ellipse cx="25" cy="45" rx="11" ry="5" fill="#43A047" transform="rotate(-75 25 45)"/>

    <!-- ── Left laurel highlight ── -->
    <ellipse cx="27" cy="72" rx="8" ry="3" fill="#A5D6A7" opacity="0.5" transform="rotate(-20 27 72)"/>
    <ellipse cx="20" cy="58" rx="8" ry="3" fill="#A5D6A7" opacity="0.5" transform="rotate(-48 20 58)"/>
    <ellipse cx="23" cy="43" rx="8" ry="3" fill="#A5D6A7" opacity="0.5" transform="rotate(-75 23 43)"/>

    <!-- ── Left stem ── -->
    <path d="M 40,82 Q 24,66 26,42" fill="none" stroke="#2E7D32" stroke-width="2.5" stroke-linecap="round"/>

    <!-- ── Right laurel shadow ── -->
    <ellipse cx="89" cy="76" rx="11" ry="5" fill="#1B5E20" opacity="0.3" transform="rotate(20 89 76)"/>
    <ellipse cx="96" cy="62" rx="11" ry="5" fill="#1B5E20" opacity="0.3" transform="rotate(48 96 62)"/>
    <ellipse cx="93" cy="47" rx="11" ry="5" fill="#1B5E20" opacity="0.3" transform="rotate(75 93 47)"/>

    <!-- ── Right laurel main ── -->
    <ellipse cx="91" cy="74" rx="11" ry="5" fill="#43A047" transform="rotate(20 91 74)"/>
    <ellipse cx="98" cy="60" rx="11" ry="5" fill="#388E3C" transform="rotate(48 98 60)"/>
    <ellipse cx="95" cy="45" rx="11" ry="5" fill="#43A047" transform="rotate(75 95 45)"/>

    <!-- ── Right laurel highlight ── -->
    <ellipse cx="93" cy="72" rx="8" ry="3" fill="#A5D6A7" opacity="0.5" transform="rotate(20 93 72)"/>
    <ellipse cx="100" cy="58" rx="8" ry="3" fill="#A5D6A7" opacity="0.5" transform="rotate(48 100 58)"/>
    <ellipse cx="97" cy="43" rx="8" ry="3" fill="#A5D6A7" opacity="0.5" transform="rotate(75 97 43)"/>

    <!-- ── Right stem ── -->
    <path d="M 80,82 Q 96,66 94,42" fill="none" stroke="#2E7D32" stroke-width="2.5" stroke-linecap="round"/>

    <!-- ── Star shadow ── -->
    <polygon points="63,26 72,49 97,50 77,66 84,90 63,76 42,90 49,66 26,50 51,49"
             fill="#8D6E00" opacity="0.35"/>

    <!-- ── Star main ── -->
    <polygon points="60,22 69,45 94,46 74,62 81,86 60,72 39,86 46,62 26,46 51,45"
             fill="url(#sg)"/>

    <!-- ── Star shine overlay ── -->
    <polygon points="60,22 69,45 94,46 74,62 81,86 60,72 39,86 46,62 26,46 51,45"
             fill="url(#shine)"/>

    <!-- ── Star stroke ── -->
    <polygon points="60,22 69,45 94,46 74,62 81,86 60,72 39,86 46,62 26,46 51,45"
             fill="none" stroke="#B8860B" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- ── Smile arc shadow ── -->
    <path d="M 38,95 Q 60,108 82,95" fill="none" stroke="#8D4E00" stroke-width="3.5" stroke-linecap="round" opacity="0.3"/>

    <!-- ── Smile arc main ── -->
    <path d="M 37,93 Q 60,106 83,93" fill="none" stroke="#F57C00" stroke-width="3.5" stroke-linecap="round"/>

    <!-- ── Smile arc highlight ── -->
    <path d="M 37,93 Q 60,106 83,93" fill="none" stroke="#FFCC80" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

    <!-- ── Sparkle accent ── -->
    <rect x="95" y="10" width="9.6" height="9.6" rx="2" fill="#FFC107" opacity="0.95"/>
    <circle cx="110" cy="24" r="3.6" fill="#FFC107" opacity="0.95"/>
  </g>
</svg>
