<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="tg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#90CAF9"/>
      <stop offset="100%" stop-color="#1565C0"/>
    </linearGradient>
    <linearGradient id="tg2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#42A5F5"/>
      <stop offset="100%" stop-color="#0D47A1"/>
    </linearGradient>
    <clipPath id="c"><rect width="120" height="120"/></clipPath>
  </defs>
  <g clip-path="url(#c)">

    <!-- ── Tripod shadow ── -->
    <line x1="63" y1="72" x2="49" y2="98" stroke="#0D2766" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
    <line x1="63" y1="72" x2="77" y2="98" stroke="#0D2766" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
    <line x1="49" y1="94" x2="77" y2="94" stroke="#0D2766" stroke-width="3" stroke-linecap="round" opacity="0.4"/>

    <!-- ── Tripod main ── -->
    <line x1="61" y1="70" x2="47" y2="96" stroke="#1565C0" stroke-width="4" stroke-linecap="round"/>
    <line x1="61" y1="70" x2="75" y2="96" stroke="#1565C0" stroke-width="4" stroke-linecap="round"/>
    <line x1="47" y1="92" x2="75" y2="92" stroke="#1565C0" stroke-width="3" stroke-linecap="round"/>

    <!-- ── Tripod feet ── -->
    <circle cx="47" cy="96" r="4" fill="#0D47A1"/>
    <circle cx="75" cy="96" r="4" fill="#0D47A1"/>

    <!-- ── Tube shadow ── -->
    <rect x="34" y="56" width="60" height="18" rx="9" fill="#0D2766" opacity="0.35"/>

    <!-- ── Tube main ── -->
    <rect x="32" y="54" width="60" height="18" rx="9" fill="url(#tg)"/>

    <!-- ── Tube highlight ── -->
    <rect x="34" y="56" width="44" height="6" rx="3" fill="white" opacity="0.25"/>

    <!-- ── Eyepiece (right) shadow ── -->
    <rect x="86" y="58" width="14" height="11" rx="4" fill="#0D2766" opacity="0.35"/>

    <!-- ── Eyepiece main ── -->
    <rect x="84" y="56" width="14" height="11" rx="4" fill="#1565C0"/>
    <rect x="86" y="58" width="8" height="4" rx="2" fill="#42A5F5" opacity="0.5"/>

    <!-- ── Lens (left) shadow ── -->
    <circle cx="38" cy="65" r="11" fill="#0D2766" opacity="0.35"/>

    <!-- ── Lens main ── -->
    <circle cx="36" cy="63" r="11" fill="#1976D2"/>
    <circle cx="36" cy="63" r="7" fill="url(#tg2)"/>
    <!-- Lens reflection -->
    <circle cx="32" cy="59" r="3" fill="white" opacity="0.35"/>
    <circle cx="40" cy="67" r="2" fill="white" opacity="0.15"/>

    <!-- ── Sparkle star top-left ── -->
    <line x1="18" y1="24" x2="18" y2="14" stroke="#FDD835" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="18" y1="34" x2="18" y2="44" stroke="#FDD835" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="8"  y1="29" x2="0"  y2="29" stroke="#FDD835" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="28" y1="29" x2="38" y2="29" stroke="#FDD835" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="11" y1="17" x2="6"  y2="12" stroke="#FDD835" stroke-width="2" stroke-linecap="round"/>
    <line x1="25" y1="41" x2="30" y2="46" stroke="#FDD835" stroke-width="2" stroke-linecap="round"/>
    <line x1="25" y1="17" x2="30" y2="12" stroke="#FDD835" stroke-width="2" stroke-linecap="round"/>
    <line x1="11" y1="41" x2="6"  y2="46" stroke="#FDD835" stroke-width="2" stroke-linecap="round"/>
    <circle cx="18" cy="29" r="3" fill="#FDD835"/>

    <!-- ── Sparkle accent ── -->
    <rect x="95" y="10" width="9.6" height="9.6" rx="2" fill="#64B5F6" opacity="0.95"/>
    <circle cx="110" cy="24" r="3.6" fill="#64B5F6" opacity="0.95"/>
  </g>
</svg>
