<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA726"/>
      <stop offset="100%" stop-color="#E64A19"/>
    </linearGradient>
    <linearGradient id="eraser" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8BBD0"/>
      <stop offset="100%" stop-color="#EC407A"/>
    </linearGradient>
    <clipPath id="c"><rect width="120" height="120"/></clipPath>
  </defs>
  <g clip-path="url(#c)">

    <!-- ── Eraser cap shadow ── -->
    <rect x="68" y="18" width="22" height="18" rx="5" fill="#880E4F" opacity="0.3"
          transform="rotate(45 79 27) translate(2,3)"/>
    <!-- ── Eraser cap main ── -->
    <rect x="68" y="18" width="22" height="18" rx="5" fill="url(#eraser)"
          transform="rotate(45 79 27)"/>
    <!-- ── Eraser cap highlight ── -->
    <rect x="70" y="20" width="14" height="7" rx="3" fill="white" opacity="0.3"
          transform="rotate(45 77 23.5)"/>

    <!-- ── Eraser band shadow ── -->
    <rect x="64" y="32" width="6" height="16" rx="2" fill="#880E4F" opacity="0.3"
          transform="rotate(45 67 40) translate(2,2)"/>
    <!-- ── Eraser band main ── -->
    <rect x="64" y="32" width="6" height="16" rx="2" fill="#F06292"
          transform="rotate(45 67 40)"/>
    <rect x="65" y="34" width="3" height="6" rx="1" fill="#FCE4EC" opacity="0.5"
          transform="rotate(45 66.5 37)"/>

    <!-- ── Pencil body shadow ── -->
    <rect x="22" y="46" width="56" height="22" rx="5" fill="#8D2000" opacity="0.3"
          transform="rotate(45 50 57) translate(3,3)"/>
    <!-- ── Pencil body main ── -->
    <rect x="22" y="46" width="56" height="22" rx="5" fill="url(#body)"
          transform="rotate(45 50 57)"/>
    <!-- ── Pencil body highlight (streak) ── -->
    <rect x="26" y="48" width="50" height="7" rx="3" fill="#FFE0B2" opacity="0.35"
          transform="rotate(45 51 51.5)"/>
    <!-- ── Pencil body side stripe ── -->
    <rect x="22" y="57" width="56" height="4" fill="#E64A19" opacity="0.4"
          transform="rotate(45 50 59)"/>

    <!-- ── Wood cone shadow ── -->
    <polygon points="21,89 32,78 42,88" fill="#8D4E00" opacity="0.3" transform="translate(2,3)"/>
    <!-- ── Wood cone main ── -->
    <polygon points="20,88 32,76 42,86" fill="#FFF176"/>
    <!-- ── Wood cone highlight ── -->
    <polygon points="20,88 26,82 30,86" fill="white" opacity="0.4"/>

    <!-- ── Graphite tip shadow ── -->
    <polygon points="21,90 24,87 26,89" fill="#212121" opacity="0.3" transform="translate(2,2)"/>
    <!-- ── Graphite tip main ── -->
    <polygon points="20,90 24,85 26,89" fill="#424242"/>
    <polygon points="20,90 22,87 24,89" fill="#757575" opacity="0.5"/>

    <!-- ── Sparkle accent ── -->
    <rect x="95" y="10" width="9.6" height="9.6" rx="2" fill="#FFA726" opacity="0.95"/>
    <circle cx="110" cy="24" r="3.6" fill="#FFA726" opacity="0.95"/>
  </g>
</svg>
