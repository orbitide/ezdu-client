  <path d="M35 268 L37 262 L39 268 L45 270 L39 272 L37 278 L35 272 L29 270 Z" fill="#34d399" opacity="0.4"/>
  <circle cx="370" cy="200" r="5" fill="#f97316" opacity="0.35"/>
  <circle cx="44" cy="308" r="4" fill="#34d399" opacity="0.3"/>
  <circle cx="382" cy="290" r="3" fill="#fbbf24" opacity="0.3"/>
  <circle cx="90" cy="170" r="3" fill="#f97316" opacity="0.25"/>
