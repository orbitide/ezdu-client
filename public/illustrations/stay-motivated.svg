    <rect width="82" height="90" rx="20" fill="#1c0800" stroke="#f97316" stroke-width="1.5"/>
    <!-- Hand-drawn flame path -->
    <path d="M41 72 C28 60 26 46 36 36 C37 46 42 49 47 42 C50 35 52 26 44 17 C56 24 64 36 59 50 C64 42 68 37 65 29 C74 39 72 55 62 64 C58 69 51 74 41 72 Z" fill="url(#flameGrad)" opacity="0.95"/>
    <!-- Inner highlight -->
    <path d="M41 68 C35 61 34 52 40 44 C40 50 43 52 46 47 C48 42 49 36 44 29 C52 35 56 44 52 53 C55 48 57 44 55 39 C61 46 60 57 53 63 C50 66 46 70 41 68 Z" fill="#fbbf24" opacity="0.35"/>
    <text x="41" y="84" text-anchor="middle" font-size="10" font-weight="800" fill="#fb923c" font-family="system-ui, -apple-system, sans-serif">১৭ দিন</text>
  </g>

  <!-- XP bonus toast (right of phone) -->
  <g transform="translate(318, 110)" filter="url(#softdrop)">
    <rect width="90" height="52" rx="14" fill="#0a1a0f" fill-opacity="0.9" stroke="#34d399" stroke-width="1.5"/>
    <text x="45" y="24" text-anchor="middle" font-size="8" fill="#86efac" font-family="system-ui, sans-serif">স্ট্রিক বোনাস!</text>
    <text x="45" y="42" text-anchor="middle" font-size="15" font-weight="800" fill="#34d399" font-family="system-ui, sans-serif">+১০০ XP</text>
