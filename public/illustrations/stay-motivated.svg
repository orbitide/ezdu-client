  <path d="M131 109 L134 112 L141 105" stroke="#34d399" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="149" y="100" width="17" height="17" rx="5" fill="#052e16"/>
  <path d="M152 109 L155 112 L162 105" stroke="#34d399" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
