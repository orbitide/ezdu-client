  <rect x="128" y="144" width="17" height="17" rx="5" fill="#052e16"/>
  <path d="M131 153 L134 156 L141 149" stroke="#34d399" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="149" y="144" width="17" height="17" rx="5" fill="#052e16"/>
  <path d="M152 153 L155 156 L162 149" stroke="#34d399" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="170" y="144" width="17" height="17" rx="5" fill="#052e16"/>
