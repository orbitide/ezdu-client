<svg viewBox="0 0 420 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="progressGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="30%" y1="100%" x2="70%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="flameglow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="drop">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <filter id="softdrop">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Phone device -->
  <g filter="url(#drop)">
    <rect x="110" y="15" width="200" height="295" rx="30" fill="#141414"/>
    <rect x="110" y="15" width="200" height="295" rx="30" stroke="#2d2d2d" stroke-width="2"/>
    <rect x="120" y="26" width="180" height="273" rx="22" fill="#0d0d0d"/>
    <!-- Notch -->
    <rect x="175" y="23" width="70" height="12" rx="6" fill="#141414"/>
  </g>

  <!-- App header -->
  <rect x="128" y="44" width="164" height="34" rx="10" fill="#1a1a1a"/>
  <text x="210" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#f4f4f5" font-family="system-ui, -apple-system, sans-serif">স্ট্রিক ক্যালেন্ডার</text>

  <!-- Day labels -->
  <text x="136" y="94" font-size="8" fill="#52525b" font-family="system-ui, sans-serif">শ</text>
