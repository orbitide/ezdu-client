  <path d="M263 125 C259 128 258 132 261 135 C261 132 263 131 264 133 C265 131 266 128 263 125 Z" fill="#f97316"/>
  <path d="M263 124 C259 128 258 133 262 136 C262 133 264 132 265 134 C266 131 266 128 263 124 Z" fill="#fbbf24" opacity="0.7"/>

