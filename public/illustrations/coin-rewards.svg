<svg viewBox="0 0 420 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="coinGlow">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cardDrop">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="trophyGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="rank1Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#052e16"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
  </defs>

  <!-- Leaderboard panel (semi-transparent, floating) -->
  <g filter="url(#cardDrop)">
    <rect x="110" y="50" width="200" height="222" rx="24" fill="#111111" fill-opacity="0.92"/>
    <rect x="110" y="50" width="200" height="222" rx="24" stroke="#2a2a2a" stroke-width="1.5"/>
  </g>

  <!-- Panel header -->
  <rect x="110" y="50" width="200" height="44" rx="24" fill="#1a1a1a"/>
  <rect x="110" y="76" width="200" height="18" rx="0" fill="#1a1a1a"/>
  <text x="210" y="75" text-anchor="middle" font-size="12" font-weight="700" fill="#f4f4f5" font-family="system-ui, -apple-system, sans-serif">লিডারবোর্ড</text>
  <text x="210" y="88" text-anchor="middle" font-size="8" fill="#52525b" font-family="system-ui, sans-serif">এই সপ্তাহের শীর্ষ শিক্ষার্থী</text>

  <!-- Rank 1 -->
  <rect x="122" y="100" width="176" height="46" rx="12" fill="url(#rank1Grad)" stroke="#34d399" stroke-width="1.5"/>
  <circle cx="146" cy="123" r="14" fill="#065f46" stroke="#34d399" stroke-width="1.5"/>
  <!-- Crown shape for rank 1 -->
  <path d="M138 127 L140 120 L144 124 L146 118 L148 124 L152 120 L154 127 Z" fill="#fbbf24"/>
  <text x="167" y="119" font-size="10" font-weight="700" fill="#f4f4f5" font-family="system-ui, sans-serif">আরাফাত হোসেন</text>
  <text x="167" y="133" font-size="9" fill="#34d399" font-family="system-ui, sans-serif">৪,২৮০ XP</text>
  <!-- #1 label -->
  <text x="286" y="127" text-anchor="end" font-size="13" font-weight="800" fill="#fbbf24" font-family="system-ui, sans-serif">#1</text>

  <!-- Rank 2 -->
  <rect x="122" y="152" width="176" height="40" rx="12" fill="#1a1a1a"/>
  <circle cx="142" cy="172" r="11" fill="#272727" stroke="#52525b" stroke-width="1"/>
  <!-- Silver medal shape -->
  <circle cx="142" cy="172" r="7" fill="#a1a1aa" opacity="0.6"/>
  <text x="142" y="176" text-anchor="middle" font-size="7" font-weight="800" fill="#e4e4e7" font-family="system-ui, sans-serif">2</text>
  <text x="162" y="168" font-size="9" font-weight="600" fill="#a1a1aa" font-family="system-ui, sans-serif">সানজিদা ইসলাম</text>
  <text x="162" y="180" font-size="8" fill="#71717a" font-family="system-ui, sans-serif">৩,৬৫০ XP</text>
  <text x="286" y="175" text-anchor="end" font-size="11" font-weight="700" fill="#a1a1aa" font-family="system-ui, sans-serif">#2</text>

  <!-- Rank 3 -->
  <rect x="122" y="198" width="176" height="40" rx="12" fill="#1a1a1a"/>
  <circle cx="142" cy="218" r="11" fill="#272727" stroke="#52525b" stroke-width="1"/>
  <!-- Bronze medal -->
  <circle cx="142" cy="218" r="7" fill="#92400e" opacity="0.7"/>
  <text x="142" y="222" text-anchor="middle" font-size="7" font-weight="800" fill="#fbbf24" font-family="system-ui, sans-serif">3</text>
  <text x="162" y="214" font-size="9" font-weight="600" fill="#a1a1aa" font-family="system-ui, sans-serif">তানভীর রহমান</text>
  <text x="162" y="226" font-size="8" fill="#71717a" font-family="system-ui, sans-serif">৩,১২০ XP</text>
  <text x="286" y="221" text-anchor="end" font-size="11" font-weight="700" fill="#a1a1aa" font-family="system-ui, sans-serif">#3</text>

  <!-- "You" indicator -->
  <rect x="122" y="244" width="176" height="16" rx="8" fill="#0d0d0d" stroke="#2a2a2a" stroke-width="1"/>
  <text x="210" y="256" text-anchor="middle" font-size="7.5" fill="#52525b" font-family="system-ui, sans-serif">তুমি: #১৫  •  ১,৮৪০ XP  •  আরো ৪৪০ XP = #১৪</text>

  <!-- Large coin (left floating) — real coin.svg paths scaled 5x -->
  <g transform="translate(18, 90)" filter="url(#coinGlow)">
    <g transform="scale(5)">
      <path d="M12.72 22.56C18.0219 22.56 22.32 18.2619 22.32 12.96C22.32 7.65805 18.0219 3.35999 12.72 3.35999C7.41806 3.35999 3.12 7.65805 3.12 12.96C3.12 18.2619 7.41806 22.56 12.72 22.56Z" fill="#8C6500"/>
      <path d="M12 21.6C17.3019 21.6 21.6 17.302 21.6 12C21.6 6.69809 17.3019 2.40002 12 2.40002C6.69806 2.40002 2.39999 6.69809 2.39999 12C2.39999 17.302 6.69806 21.6 12 21.6Z" fill="#CC9300"/>
      <path d="M12 19.92C16.3741 19.92 19.92 16.3741 19.92 12C19.92 7.62586 16.3741 4.07996 12 4.07996C7.62589 4.07996 4.07999 7.62586 4.07999 12C4.07999 16.3741 7.62589 19.92 12 19.92Z" fill="#FFB800"/>
      <path d="M12 19.2C15.9764 19.2 19.2 15.9765 19.2 12C19.2 8.0236 15.9764 4.80005 12 4.80005C8.02354 4.80005 4.79999 8.0236 4.79999 12C4.79999 15.9765 8.02354 19.2 12 19.2Z" stroke="#FFBF1A" stroke-width="3.84"/>
      <path d="M12 8.16003L15.36 12L12 15.84L8.64001 12L12 8.16003Z" fill="#FFB800"/>
      <path opacity="0.7" d="M12 8.16003L15.36 12L12 10.56V8.16003Z" fill="#FFD159"/>
      <path opacity="0.5" d="M7.20001 8.16003C8.64001 6.24003 10.56 5.28003 12.48 5.28003" stroke="white" stroke-width="3.84" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Medium coin (top right area) — real coin paths scaled 3.5x -->
  <g transform="translate(334, 60)" filter="url(#coinGlow)">
    <g transform="scale(3.5)">
      <path d="M12.72 22.56C18.0219 22.56 22.32 18.2619 22.32 12.96C22.32 7.65805 18.0219 3.35999 12.72 3.35999C7.41806 3.35999 3.12 7.65805 3.12 12.96C3.12 18.2619 7.41806 22.56 12.72 22.56Z" fill="#8C6500"/>
      <path d="M12 21.6C17.3019 21.6 21.6 17.302 21.6 12C21.6 6.69809 17.3019 2.40002 12 2.40002C6.69806 2.40002 2.39999 6.69809 2.39999 12C2.39999 17.302 6.69806 21.6 12 21.6Z" fill="#CC9300"/>
      <path d="M12 19.92C16.3741 19.92 19.92 16.3741 19.92 12C19.92 7.62586 16.3741 4.07996 12 4.07996C7.62589 4.07996 4.07999 7.62586 4.07999 12C4.07999 16.3741 7.62589 19.92 12 19.92Z" fill="#FFB800"/>
      <path d="M12 8.16003L15.36 12L12 15.84L8.64001 12L12 8.16003Z" fill="#FFB800"/>
      <path opacity="0.7" d="M12 8.16003L15.36 12L12 10.56V8.16003Z" fill="#FFD159"/>
    </g>
  </g>

  <!-- Small coin (bottom left) — scaled 2.5x -->
  <g transform="translate(44, 265)">
    <g transform="scale(2.5)">
      <path d="M12 21.6C17.3019 21.6 21.6 17.302 21.6 12C21.6 6.69809 17.3019 2.40002 12 2.40002C6.69806 2.40002 2.39999 6.69809 2.39999 12C2.39999 17.302 6.69806 21.6 12 21.6Z" fill="#CC9300"/>
      <path d="M12 19.92C16.3741 19.92 19.92 16.3741 19.92 12C19.92 7.62586 16.3741 4.07996 12 4.07996C7.62589 4.07996 4.07999 7.62586 4.07999 12C4.07999 16.3741 7.62589 19.92 12 19.92Z" fill="#FFB800"/>
    </g>
  </g>

  <!-- Trophy floating top-center -->
  <g transform="translate(172, 0)" filter="url(#trophyGlow)">
    <!-- Trophy cup -->
    <rect x="14" y="14" width="56" height="42" rx="8" fill="#854d0e"/>
    <rect x="20" y="20" width="44" height="32" rx="6" fill="#92400e"/>
    <!-- Cup handles -->
    <path d="M14 26 Q4 26 4 38 Q4 50 14 50" stroke="#fbbf24" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M70 26 Q80 26 80 38 Q80 50 70 50" stroke="#fbbf24" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Star in cup -->
    <polygon points="42,24 44.5,31 52,31 46,36 48.5,43 42,39 35.5,43 38,36 32,31 39.5,31" fill="#fbbf24"/>
    <!-- Stem -->
    <rect x="34" y="56" width="16" height="8" rx="2" fill="#854d0e" stroke="#fbbf24" stroke-width="1.5"/>
    <!-- Base -->
    <rect x="24" y="64" width="36" height="6" rx="3" fill="#854d0e" stroke="#fbbf24" stroke-width="1.5"/>
    <!-- Shine -->
    <circle cx="28" cy="26" r="3" fill="#fef3c7" opacity="0.7"/>
    <!-- Sparkle around trophy -->
    <path d="M5 10 L6.5 5 L8 10 L13 11.5 L8 13 L6.5 18 L5 13 L0 11.5 Z" fill="#fbbf24" opacity="0.6"/>
    <path d="M78 10 L79.5 5 L81 10 L86 11.5 L81 13 L79.5 18 L78 13 L73 11.5 Z" fill="#fbbf24" opacity="0.5"/>
  </g>

  <!-- XP badge (bottom right floating) -->
  <g transform="translate(316, 240)">
    <rect width="90" height="46" rx="12" fill="#1c1400" fill-opacity="0.9" stroke="#fbbf24" stroke-width="1.5"/>
    <!-- bolt inside badge -->
    <g transform="translate(10, 8) scale(1.1)">
      <path d="M13.92 1.44L6.24 12.96H11.04L9.12 22.56L17.76 9.6H12.96L14.88 1.44H13.92Z" fill="#533794"/>
      <path d="M13.92 1.44L6.24 12.96H11.04L9.12 22.56L17.76 9.6H12.96L14.88 1.44H13.92Z" fill="#8B5CF6" opacity="0.8"/>
      <path d="M12.96 4.32L8.64 11.52H11.52L10.56 18.72L15.84 10.08H12.96L13.92 4.32H12.96Z" fill="#C4B5FD"/>
    </g>
    <text x="55" y="25" text-anchor="middle" font-size="8" fill="#fde68a" font-family="system-ui, sans-serif">আজ অর্জিত</text>
    <text x="55" y="40" text-anchor="middle" font-size="13" font-weight="800" fill="#fbbf24" font-family="system-ui, sans-serif">+২৫০ XP</text>
  </g>

  <!-- Sparkle stars -->
  <path d="M355 190 L357 184 L359 190 L365 192 L359 194 L357 200 L355 194 L349 192 Z" fill="#fbbf24" opacity="0.5"/>
  <path d="M30 175 L32 170 L34 175 L39 177 L34 179 L32 184 L30 179 L25 177 Z" fill="#34d399" opacity="0.4"/>
  <circle cx="390" cy="160" r="5" fill="#fbbf24" opacity="0.35"/>
  <circle cx="26" cy="55" r="4" fill="#fbbf24" opacity="0.3"/>
</svg>
