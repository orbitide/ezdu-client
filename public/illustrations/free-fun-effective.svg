    <circle cx="56" cy="56" r="27" stroke="#38bdf8" stroke-width="1.5" fill="none" opacity="0.55"/>
    <circle cx="56" cy="56" r="14" stroke="#38bdf8" stroke-width="1.5" fill="none" opacity="0.8"/>
