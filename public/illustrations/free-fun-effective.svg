    <rect x="36" y="52" width="40" height="28" rx="5" fill="#34d399"/>
    <rect x="36" y="42" width="40" height="14" rx="5" fill="#6ee7b7"/>
    <rect x="53" y="42" width="6" height="38" fill="#a7f3d0"/>
