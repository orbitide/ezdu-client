<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="paper">
      <rect x="5" y="4" width="30" height="37" rx="3"/>
    </clipPath>
  </defs>
  <!-- Paper -->
  <rect x="5" y="4" width="30" height="37" rx="3" fill="white" stroke="#E2E8F0" stroke-width="1.5"/>
  <!-- 3-color header stripes -->
  <rect x="5" y="4" width="10" height="10" fill="#F87171" clip-path="url(#paper)"/>
  <rect x="15" y="4" width="10" height="10" fill="#FBBF24" clip-path="url(#paper)"/>
  <rect x="25" y="4" width="10" height="10" fill="#34D399" clip-path="url(#paper)"/>
  <!-- MCQ row 1 — selected (green) -->
  <circle cx="12" cy="21" r="3" fill="#34D399"/>
  <path d="M10 21 L11.5 22.5 L14.5 19.5" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="18" y1="21" x2="31" y2="21" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round"/>
  <!-- MCQ row 2 (amber outline) -->
  <circle cx="12" cy="29" r="3" stroke="#FBBF24" stroke-width="1.5" fill="none"/>
  <line x1="18" y1="29" x2="29" y2="29" stroke="#E2E8F0" stroke-width="1.5" stroke-linecap="round"/>
  <!-- MCQ row 3 (coral outline) -->
  <circle cx="12" cy="37" r="3" stroke="#F87171" stroke-width="1.5" fill="none"/>
  <line x1="18" y1="37" x2="31" y2="37" stroke="#E2E8F0" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Result badge -->
  <circle cx="38" cy="38" r="10" fill="#16A34A"/>
  <circle cx="38" cy="38" r="8" fill="#22C55E"/>
  <path d="M33 38 L36.5 42 L43 33" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
